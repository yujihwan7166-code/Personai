<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="60%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="900" cy="180" r="280" fill="url(#glow)"/>
  <circle cx="260" cy="480" r="240" fill="url(#glow)"/>

  <!-- 로고 배지 -->
  <rect x="80" y="80" width="72" height="72" rx="18" fill="url(#accent)"/>
  <text x="116" y="133" text-anchor="middle" font-family="'Inter', 'Pretendard', sans-serif"
        font-weight="800" font-size="42" fill="#0f172a">P</text>
  <text x="168" y="126" font-family="'Inter', 'Pretendard', sans-serif"
        font-weight="600" font-size="24" fill="#cbd5e1" letter-spacing="2">Personai</text>

  <!-- 메인 타이틀 -->
  <text x="80" y="280" font-family="'Newsreader','Pretendard',serif"
        font-weight="600" font-size="82" fill="#f8fafc" letter-spacing="-2">
    246+ AI 전문가와
  </text>
  <text x="80" y="370" font-family="'Newsreader','Pretendard',serif"
        font-weight="600" font-size="82" fill="url(#accent)" letter-spacing="-2">
    함께하는 토론·상담
  </text>

  <!-- 서브 카피 -->
  <text x="80" y="450" font-family="'Inter','Pretendard',sans-serif"
        font-weight="400" font-size="30" fill="#94a3b8">
    토론 · 심층 리서치 · 번역 · 파일 변환 · 공부 도우미
  </text>

  <!-- 칩 -->
  <g font-family="'Inter','Pretendard',sans-serif" font-weight="500" font-size="22" fill="#cbd5e1">
    <rect x="80"  y="510" width="130" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="145" y="540" text-anchor="middle">💬 토론</text>
    <rect x="225" y="510" width="170" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="310" y="540" text-anchor="middle">🔬 심층 리서치</text>
    <rect x="410" y="510" width="150" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="485" y="540" text-anchor="middle">🌐 번역</text>
    <rect x="575" y="510" width="180" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="665" y="540" text-anchor="middle">📄 파일 변환</text>
    <rect x="770" y="510" width="160" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="850" y="540" text-anchor="middle">📚 공부</text>
  </g>
</svg>
