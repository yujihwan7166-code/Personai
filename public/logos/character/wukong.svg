<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Red cape behind shoulders -->
  <path d="M22 118 Q22 96 42 90 L86 90 Q106 96 106 118 Z" fill="#d94a3e"/>
  <path d="M42 90 Q42 100 50 104 L78 104 Q86 100 86 90 Z" fill="#a8362d"/>
  <!-- Tiger-skin armor on shoulders (yellow with stripes) -->
  <path d="M30 110 Q34 96 50 94 L50 118 L30 118 Z" fill="#f0c14a"/>
  <path d="M98 110 Q94 96 78 94 L78 118 L98 118 Z" fill="#f0c14a"/>
  <path d="M36 100 L42 102 M36 108 L44 110 M92 100 L86 102 M92 108 L84 110" stroke="#3a2a18" stroke-width="2" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="58" y="82" width="12" height="10" rx="3" fill="#e8b888"/>
  <!-- Monkey face base (peach/tan) -->
  <ellipse cx="64" cy="62" rx="26" ry="27" fill="#d99a5e"/>
  <!-- Inner face (lighter muzzle area) -->
  <ellipse cx="64" cy="68" rx="20" ry="20" fill="#f6d6b0"/>
  <!-- Ears -->
  <ellipse cx="34" cy="62" rx="6" ry="8" fill="#d99a5e"/>
  <ellipse cx="94" cy="62" rx="6" ry="8" fill="#d99a5e"/>
  <ellipse cx="34" cy="62" rx="3" ry="5" fill="#f6c7a0"/>
  <ellipse cx="94" cy="62" rx="3" ry="5" fill="#f6c7a0"/>
  <!-- Golden circlet headband -->
  <path d="M40 50 Q64 40 88 50 L88 56 Q64 48 40 56 Z" fill="#f3c734"/>
  <path d="M40 50 Q64 40 88 50 L88 56 Q64 48 40 56 Z" fill="none" stroke="#a8821a" stroke-width="1.2"/>
  <!-- Circlet center jewel/curl -->
  <path d="M58 46 Q64 38 70 46 Q66 44 64 46 Q62 44 58 46 Z" fill="#f3c734" stroke="#a8821a" stroke-width="1"/>
  <!-- Hair tufts above headband -->
  <path d="M44 50 Q42 42 48 40 Q50 46 50 50 Z" fill="#3a2a18"/>
  <path d="M84 50 Q86 42 80 40 Q78 46 78 50 Z" fill="#3a2a18"/>
  <path d="M58 44 Q60 38 64 40 Q68 38 70 44 Z" fill="#3a2a18"/>
  <!-- Eyes (big mischievous) -->
  <ellipse cx="54" cy="66" rx="3.4" ry="4" fill="#2a1d12"/>
  <ellipse cx="74" cy="66" rx="3.4" ry="4" fill="#2a1d12"/>
  <circle cx="55" cy="65" r="1" fill="#fff"/>
  <circle cx="75" cy="65" r="1" fill="#fff"/>
  <!-- Brows (raised, playful) -->
  <path d="M48 60 Q54 57 58 60 M70 60 Q74 57 80 60" stroke="#3a2a18" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Pink muzzle nose -->
  <ellipse cx="64" cy="74" rx="3.4" ry="2.4" fill="#e88a8a"/>
  <!-- Grin with fang -->
  <path d="M54 80 Q64 88 74 80" stroke="#7a3a2a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M56 80 Q64 86 72 80 Q64 82 56 80 Z" fill="#ffffff"/>
  <path d="M60 82 L62 86 L64 82 Z" fill="#ffffff"/>
  <!-- Cheek blush -->
  <circle cx="48" cy="74" r="3" fill="#e88a8a" opacity="0.5"/>
  <circle cx="80" cy="74" r="3" fill="#e88a8a" opacity="0.5"/>
  <!-- Gold staff at side -->
  <rect x="100" y="20" width="4" height="100" rx="2" fill="#d4a020"/>
  <rect x="98" y="20" width="8" height="6" rx="1" fill="#a8821a"/>
  <rect x="98" y="114" width="8" height="6" rx="1" fill="#a8821a"/>
</svg>
