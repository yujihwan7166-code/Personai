<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Inverness cape coat -->
  <path d="M28 118 Q28 92 44 86 L84 86 Q100 92 100 118 Z" fill="#7c8a99"/>
  <path d="M28 118 Q28 92 44 86 L64 102 L84 86 Q100 92 100 118 Z" fill="#5f6e7e" opacity="0.55"/>
  <!-- Neck -->
  <rect x="56" y="80" width="16" height="12" rx="4" fill="#f1c9a5"/>
  <!-- Face -->
  <ellipse cx="64" cy="68" rx="26" ry="28" fill="#f5d3b0"/>
  <!-- Hair under hat -->
  <path d="M40 60 Q44 76 50 80 L48 64 Z" fill="#3a2a1d"/>
  <path d="M88 60 Q84 76 78 80 L80 64 Z" fill="#3a2a1d"/>
  <!-- Deerstalker hat: brim -->
  <ellipse cx="64" cy="48" rx="34" ry="6" fill="#7a5a3a"/>
  <!-- Deerstalker crown with earflaps -->
  <path d="M34 48 Q34 22 64 22 Q94 22 94 48 Q90 50 84 48 Q80 56 74 50 Q64 44 54 50 Q48 56 44 48 Q38 50 34 48 Z" fill="#9a7350"/>
  <!-- Plaid lines on hat -->
  <path d="M44 28 L44 48 M64 22 L64 48 M84 28 L84 48" stroke="#6e4f33" stroke-width="1.5" opacity="0.6"/>
  <path d="M38 32 L90 32 M38 40 L90 40" stroke="#6e4f33" stroke-width="1.5" opacity="0.6"/>
  <!-- Eyes -->
  <ellipse cx="54" cy="66" rx="2.6" ry="3.4" fill="#2a1d12"/>
  <ellipse cx="74" cy="66" rx="2.6" ry="3.4" fill="#2a1d12"/>
  <circle cx="54.8" cy="65" r="0.8" fill="#fff"/>
  <circle cx="74.8" cy="65" r="0.8" fill="#fff"/>
  <!-- Brow (serious) -->
  <path d="M48 60 L60 58 M68 58 L80 60" stroke="#3a2a1d" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Mouth (closed, slight) -->
  <path d="M58 80 Q64 82 70 80" stroke="#7a4a35" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- Pipe stem -->
  <path d="M68 80 Q82 84 92 90" stroke="#3a261a" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <!-- Pipe bowl -->
  <ellipse cx="95" cy="92" rx="6" ry="7" fill="#5a3a25"/>
  <ellipse cx="95" cy="89" rx="4" ry="2.4" fill="#e8d4ad"/>
  <!-- Cheek blush -->
  <circle cx="48" cy="74" r="3" fill="#f1a896" opacity="0.45"/>
  <circle cx="80" cy="74" r="3" fill="#f1a896" opacity="0.45"/>
</svg>
